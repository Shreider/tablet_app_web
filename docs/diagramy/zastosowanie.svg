<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc"><title id="title">Zastosowanie zapisanej polityki</title><desc id="desc">Warunki wejścia, zmiany Androida i potwierdzenie zapisu. Błąd uruchamia próbę kompensacji, nie gwarantowaną transakcję.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#376886"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f8fb"/><g font-family="sans-serif" font-size="17" fill="#17334a">
<text x="32" y="42" font-size="23" font-weight="bold">Zastosowanie zapisanej polityki</text>
<rect x="45" y="95" width="545" height="100" rx="12" fill="#ffffff" stroke="#a8bfce" stroke-width="1.5"/>
<text x="317.5" y="138.5" text-anchor="middle" font-size="18" font-weight="bold">1. Warunki wejścia</text>
<text x="317.5" y="163.5" text-anchor="middle" font-size="16" font-weight="normal">PIN, brak sesji, odblokowany ekran</text>
<path d="M317 195 V240" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="240" width="545" height="100" rx="12" fill="#ffffff" stroke="#a8bfce" stroke-width="1.5"/>
<text x="317.5" y="283.5" text-anchor="middle" font-size="18" font-weight="bold">2. Walidacja zapisu</text>
<text x="317.5" y="308.5" text-anchor="middle" font-size="16" font-weight="normal">pakiety, uprawnienia, zgoda na nakładkę</text>
<path d="M317 340 V385" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="385" width="545" height="100" rx="12" fill="#ffffff" stroke="#a8bfce" stroke-width="1.5"/>
<text x="317.5" y="428.5" text-anchor="middle" font-size="18" font-weight="bold">3. Zmiany systemowe</text>
<text x="317.5" y="453.5" text-anchor="middle" font-size="16" font-weight="normal">lista Lock Task, HOME, launchery, restrykcje</text>
<path d="M317 485 V530" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="530" width="545" height="100" rx="12" fill="#ffffff" stroke="#a8bfce" stroke-width="1.5"/>
<text x="317.5" y="573.5" text-anchor="middle" font-size="18" font-weight="bold">4. Potwierdzenie działania</text>
<text x="317.5" y="598.5" text-anchor="middle" font-size="16" font-weight="normal">LOCKED, flagi, gotowa nakładka</text>
<path d="M317 630 V675" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="675" width="545" height="100" rx="12" fill="#eaf3eb" stroke="#a8bfce" stroke-width="1.5"/>
<text x="317.5" y="718.5" text-anchor="middle" font-size="18" font-weight="bold">5. Utrwalenie sukcesu</text>
<text x="317.5" y="743.5" text-anchor="middle" font-size="16" font-weight="normal">appliedRevision, appliedRules, enabled=true</text>
<path d="M317 775 V820" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="45" y="820" width="545" height="100" rx="12" fill="#eaf3eb" stroke="#a8bfce" stroke-width="1.5"/>
<text x="317.5" y="863.5" text-anchor="middle" font-size="18" font-weight="bold">6. Powrót do pulpitu</text>
<text x="317.5" y="888.5" text-anchor="middle" font-size="16" font-weight="normal">log POLICY_APPLIED, zamknięcie autoryzacji</text>
<rect x="660" y="385" width="295" height="150" rx="12" fill="#fff0ec" stroke="#a8bfce" stroke-width="1.5"/>
<text x="807.5" y="428.5" text-anchor="middle" font-size="18" font-weight="bold">Błąd w bloku apply</text>
<text x="807.5" y="453.5" text-anchor="middle" font-size="16" font-weight="normal">próba odtworzenia</text>
<text x="807.5" y="478.5" text-anchor="middle" font-size="16" font-weight="normal">poprzedniej polityki</text>
<text x="807.5" y="503.5" text-anchor="middle" font-size="16" font-weight="normal">albo zniesienia ograniczeń</text>
<path d="M590 435 H660" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="660" y="615" width="295" height="150" rx="12" fill="#fff3d9" stroke="#a8bfce" stroke-width="1.5"/>
<text x="807.5" y="658.5" text-anchor="middle" font-size="18" font-weight="bold">Zachowanie informacji</text>
<text x="807.5" y="683.5" text-anchor="middle" font-size="16" font-weight="normal">policy.error + dziennik</text>
<text x="807.5" y="708.5" text-anchor="middle" font-size="16" font-weight="normal">możliwy błąd kompensacji</text>
<text x="807.5" y="733.5" text-anchor="middle" font-size="16" font-weight="normal">wymaga kontroli wyniku</text>
<path d="M807 535 V615" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="48" y="1010" font-size="16">Kontrole przed zmianami nie uruchamiają kompensacji. Szczegóły: PolicyEngine.apply.</text>
</g></svg>

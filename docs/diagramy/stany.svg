<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 700" role="img" aria-labelledby="title desc"><title id="title">Tryby pracy i autoryzacja</title><desc id="desc">Uproszczone przejścia między serwisem, chronionym pulpitem i sesją pojedynczą. Autoryzacja administratora jest oddzielnym wymiarem stanu.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#376886"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f8fb"/><g font-family="sans-serif" font-size="17" fill="#17334a">
<text x="32" y="42" font-size="23" font-weight="bold">Tryby pracy i autoryzacja</text>
<rect x="35" y="170" width="290" height="120" rx="12" fill="#fff3d9" stroke="#a8bfce" stroke-width="1.5"/>
<text x="180.0" y="211.0" text-anchor="middle" font-size="18" font-weight="bold">Tryb serwisowy</text>
<text x="180.0" y="236.0" text-anchor="middle" font-size="16" font-weight="normal">enabled=false</text>
<text x="180.0" y="261.0" text-anchor="middle" font-size="16" font-weight="normal">owner może pozostać</text>
<rect x="380" y="170" width="290" height="120" rx="12" fill="#eaf3eb" stroke="#a8bfce" stroke-width="1.5"/>
<text x="525.0" y="211.0" text-anchor="middle" font-size="18" font-weight="bold">Chroniony pulpit</text>
<text x="525.0" y="236.0" text-anchor="middle" font-size="16" font-weight="normal">enabled=true, LOCKED</text>
<text x="525.0" y="261.0" text-anchor="middle" font-size="16" font-weight="normal">session=null</text>
<rect x="725" y="170" width="290" height="120" rx="12" fill="#e4f0f7" stroke="#a8bfce" stroke-width="1.5"/>
<text x="870.0" y="211.0" text-anchor="middle" font-size="18" font-weight="bold">Sesja pojedyncza</text>
<text x="870.0" y="236.0" text-anchor="middle" font-size="16" font-weight="normal">enabled=true, LOCKED</text>
<text x="870.0" y="261.0" text-anchor="middle" font-size="16" font-weight="normal">session=pakiet lub web</text>
<path d="M325 190 H380" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="352" y="147" text-anchor="middle" font-size="15" fill="#375d76">apply po PIN-ie</text>
<path d="M670 190 H725" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="698" y="147" text-anchor="middle" font-size="15" fill="#375d76">launch</text>
<path d="M380 265 H350 V345 H180 V290" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="285" y="375" text-anchor="middle" font-size="15" fill="#375d76">serviceExit po PIN-ie</text>
<path d="M725 265 H700 V405 H525 V290" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700" y="438" text-anchor="middle" font-size="15" fill="#375d76">endSession po PIN-ie</text>
<path d="M830 170 V95 H910 V170" fill="none" stroke="#376886" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="875" y="77" text-anchor="middle" font-size="15" fill="#375d76">restore sesji</text>
<rect x="70" y="500" width="910" height="115" rx="12" fill="#ffffff" stroke="#a8bfce" stroke-width="1.5"/>
<text x="525.0" y="538.5" text-anchor="middle" font-size="18" font-weight="bold">Autoryzacja administratora to osobny stan w pamięci</text>
<text x="525.0" y="563.5" text-anchor="middle" font-size="16" font-weight="normal">Poprawny PIN otwiera dostęp na maksymalnie 120 s; nie wyłącza automatycznie ochrony.</text>
<text x="525.0" y="588.5" text-anchor="middle" font-size="16" font-weight="normal">Powrót przyciskiem kłódki zeruje dostęp administratora po zakończeniu sesji.</text>
<text x="38" y="665" font-size="16">Diagram pokazuje udane przejścia. Błędy mogą pozostawić stan częściowy opisany w podręczniku.</text>
</g></svg>

# Tryb lokalny: obie aplikacje na jednym komputerze.
# Na dwóch serwerach używaj plików Compose we frontend/ i backend/.
name: tablet_app_web

services:
  frontend:
    container_name: room-tablet-frontend
    build:
      context: ./frontend
      args:
        TABLET_ROOM_ID: ${TABLET_ROOM_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
    depends_on:
      cache:
        condition: service_healthy
    networks:
      - public_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  cache:
    build:
      context: ./frontend
      dockerfile: cache/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3001}
      CACHE_ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:-${ADMIN_TOKEN:-change-me-admin-token}}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      CACHE_ROOM_IDS: ${CACHE_ROOM_IDS:-${TABLET_ROOM_ID:-}}
      CACHE_REFRESH_SECONDS: ${CACHE_REFRESH_SECONDS:-60}
      CACHE_TIMEOUT_SECONDS: ${CACHE_TIMEOUT_SECONDS:-5}
    volumes:
      - type: bind
        source: ./frontend/cache-data
        target: /data
    networks:
      - public_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    container_name: room-tablet-backend
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://web_app:web_app_password@database:5432/tablet_schedule
      DATABASE_ADMIN_URL: postgresql://admin:admin_password@database:5432/tablet_schedule
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-admin-token}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Warsaw}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - public_net
      - data_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  database:
    container_name: room-tablet-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tablet_schedule
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tablet_schedule"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME}_postgres-data}
    external: ${POSTGRES_VOLUME_EXTERNAL:-false}

networks:
  public_net:
    name: room-tablet-public-net
  data_net:
    name: room-tablet-data-net
    internal: true
